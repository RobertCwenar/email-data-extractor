name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Prepare test configuration
        run: |
          cp filter_keywords_example.json filter_keywords.json
          cp scraper_urls_example.json scraper_urls.json

      - name: ruff linting
        run: |
          uv run ruff check .

      - name: Tests
        run: uv run pytest
